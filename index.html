<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Quiz Segurança da Informação</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
}

.container {
    width: 85%;
    margin: auto;
}

.question {
    background: #1e293b;
    padding: 15px;
    margin: 15px 0;
    border-radius: 10px;
}

.correct { color: #22c55e; }
.wrong { color: #ef4444; }

button {
    padding: 10px 20px;
    background: #22c55e;
    border: none;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>
<div class="container">
<h1>Quiz Completo de Segurança da Informação</h1>

<form id="quizForm"></form>

<button onclick="corrigir()">Finalizar</button>

<div id="resultado"></div>
</div>

<script>

const perguntas = [
{q:"1. Confidencialidade significa:", op:["Acesso livre","Proteção contra acesso não autorizado","Backup"], r:1},
{q:"2. Integridade garante:", op:["Dados disponíveis","Dados corretos sem alteração","Acesso remoto"], r:1},
{q:"3. Disponibilidade garante:", op:["Acesso quando necessário","Sigilo","Ataque"], r:0},
{q:"4. IDS faz:", op:["Bloqueia ataques","Detecta ataques","Criptografa"], r:1},
{q:"5. IPS faz:", op:["Detecta apenas","Bloqueia ataques","Ignora tráfego"], r:1},
{q:"6. Phishing é:", op:["Ataque físico","Engenharia social","Firewall"], r:1},
{q:"7. Ransomware:", op:["Rouba logs","Criptografa e cobra resgate","Acelera sistema"], r:1},
{q:"8. Vulnerabilidade:", op:["Fraqueza explorável","Firewall","Senha forte"], r:0},
{q:"9. Risco:", op:["Ataque","Probabilidade x impacto","Backup"], r:1},
{q:"10. Spoofing:", op:["Falsificação","Backup","Firewall"], r:0},

{q:"11. Autenticação responde:", op:["O que pode fazer?","Quem é você?","O que fez?"], r:1},
{q:"12. Autorização responde:", op:["Quem é você?","O que pode fazer?","Onde está"], r:1},
{q:"13. Auditoria responde:", op:["O que fez?","Quem é você?","Quando login"], r:0},

{q:"14. DAC:", op:["Controle rígido","Controle pelo dono","Baseado em papel"], r:1},
{q:"15. MAC:", op:["Flexível","Baseado em nível","Por usuário"], r:1},
{q:"16. RBAC:", op:["Baseado em papéis","Baseado tempo","Random"], r:0},
{q:"17. ABAC:", op:["Baseado atributo","Baseado senha","Manual"], r:0},

{q:"18. SIEM:", op:["Firewall","Centraliza logs","Antivírus"], r:1},
{q:"19. Splunk:", op:["Firewall","Plataforma análise logs","Proxy"], r:1},
{q:"20. ELK é:", op:["Antivírus","Stack de logs","Ataque"], r:1},

{q:"21. Firewall:", op:["Bloqueia tráfego","Apaga dados","Cria malware"], r:0},
{q:"22. Proxy:", op:["Intercepta conexão","Cria vírus","Apaga logs"], r:0},
{q:"23. Worm:", op:["Precisa hospedagem","Se espalha sozinho","Manual"], r:1},
{q:"24. Trojan:", op:["Disfarçado","Visível","Seguro"], r:0},
{q:"25. Spyware:", op:["Protege","Espiona","Bloqueia"], r:1},

{q:"26. Keylogger:", op:["Captura teclas","Filtra rede","Criptografa"], r:0},
{q:"27. Rootkit:", op:["Visível","Oculto e poderoso","Firewall"], r:1},
{q:"28. Botnet:", op:["Rede infectada","Firewall","Backup"], r:0},

{q:"29. Certificado digital:", op:["Identidade virtual","Backup","Ataque"], r:0},
{q:"30. Chave privada:", op:["Pública","Secreta","Compartilhada"], r:1},
{q:"31. Chave pública:", op:["Secreta","Distribuída","Oculta"], r:1},

{q:"32. RSA:", op:["Hash","Criptografia assimétrica","Firewall"], r:1},
{q:"33. ECC:", op:["Curva elíptica","Simétrica","Backup"], r:0},

{q:"34. Fase ataque inicial:", op:["Exploração","Reconhecimento","Execução"], r:1},
{q:"35. Controle preventivo:", op:["Evita ataque","Corrige","Logs"], r:0},
];

const form = document.getElementById("quizForm");

perguntas.forEach((p, i) => {
    let div = document.createElement("div");
    div.className="question";
    div.innerHTML = `<p>${p.q}</p>` +
    p.op.map((op, j)=>
        `<input type="radio" name="q${i}" value="${j}"> ${op}<br>`
    ).join("") +
    `<div id="resp${i}"></div>`;
    form.appendChild(div);
});

function corrigir() {
    let pontos = 0;

    perguntas.forEach((p, i)=>{
        let sel = document.querySelector(`input[name="q${i}"]:checked`);
        let divResp = document.getElementById(`resp${i}`);

        if(sel){
            if(parseInt(sel.value) === p.r){
                pontos++;
                divResp.innerHTML = `<span class="correct">✔ Correto</span>`;
            } else {
                divResp.innerHTML = `<span class="wrong">✖ Errado (Correta: ${p.op[p.r]})</span>`;
            }
        } else {
            divResp.innerHTML = `<span class="wrong">✖ Não respondida (Correta: ${p.op[p.r]})</span>`;
        }
    });

    document.getElementById("resultado").innerHTML =
        `<h2>Resultado: ${pontos} / ${perguntas.length}</h2>`;
}

</script>

</body>
</html>
