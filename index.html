<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Segurança da Informação</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;display:flex;justify-content:center;padding:20px}
.container{max-width:900px;width:100%;background:#1e293b;padding:25px;border-radius:12px}
h1{text-align:center}
.progress{height:20px;background:#334155;border-radius:10px;overflow:hidden;margin:15px 0}
.bar{height:100%;width:0;background:#22c55e}
.option{display:block;background:#334155;padding:12px;margin:10px 0;border-radius:8px;cursor:pointer}
.option:hover{background:#475569}
button{padding:10px 20px;border:none;border-radius:8px;background:#22c55e;color:white;cursor:pointer}
#feedback{margin-top:15px}
.correct{color:#22c55e}.wrong{color:#ef4444}
</style>
</head>
<body>
<div class="container">
<h1>Quiz Segurança da Informação</h1>
<div class="progress"><div class="bar" id="bar"></div></div>
<p id="status"></p>
<h2 id="question"></h2>
<div id="options"></div>
<div id="feedback"></div>
<button id="nextBtn" style="display:none">Próxima</button>
<div id="result"></div>
</div>

<script>
const perguntas = [
{q:"Qual pilar garante que apenas pessoas autorizadas acessem informações?",o:["Disponibilidade","Integridade","Confidencialidade","Autenticidade"],r:2,e:"Confidencialidade restringe o acesso aos autorizados."},
{q:"Qual pilar garante que os dados não foram alterados indevidamente?",o:["Integridade","Privacidade","Disponibilidade","Auditoria"],r:0,e:"Integridade assegura exatidão e consistência."},
{q:"Qual pilar garante acesso quando necessário?",o:["Disponibilidade","Hash","LGPD","Autorização"],r:0,e:"Disponibilidade garante acesso aos recursos."},
{q:"Phishing é um ataque baseado principalmente em:",o:["Força bruta","Engenharia social","DDoS","Firewall"],r:1,e:"Phishing manipula usuários."},
{q:"O WannaCry é um exemplo de:",o:["Spyware","Adware","Ransomware","Rootkit"],r:2,e:"Criptografava arquivos e exigia resgate."},
{q:"Uma senha fraca é um exemplo de:",o:["Impacto","Vulnerabilidade","Controle","Auditoria"],r:1,e:"Pode ser explorada por atacantes."},
{q:"Risco pode ser simplificado como:",o:["Senha+Firewall","Probabilidade x Impacto","Hash+Sal","IDS+IPS"],r:1,e:"Modelo clássico de avaliação."},
{q:"Qual malware se replica sozinho pela rede?",o:["Trojan","Worm","Spyware","Adware"],r:1,e:"Worms são autorreplicantes."},
{q:"Trojan significa:",o:["Programa legítimo","Malware disfarçado","Firewall","Proxy"],r:1,e:"Cavalo de Troia engana o usuário."},
{q:"Spyware tem como objetivo:",o:["Monitorar e roubar dados","Fazer backup","Filtrar tráfego","Criptografar disco"],r:0,e:"Espiona o usuário."},
{q:"Keylogger captura:",o:["Pacotes","Teclas digitadas","Logs","Emails"],r:1,e:"Registra tudo que é digitado."},
{q:"Rootkit busca:",o:["Ocultar presença do invasor","Fazer cache","Criptografar emails","Gerar certificados"],r:0,e:"Opera de forma furtiva."},
{q:"Botnet é:",o:["Rede de máquinas infectadas","Firewall","VPN","Proxy"],r:0,e:"Máquinas controladas remotamente."},
{q:"Spoofing significa:",o:["Backup","Falsificação de identidade","Hash","Auditoria"],r:1,e:"Mascara origem ou identidade."},
{q:"Autenticação responde:",o:["O que fez?","Quem é você?","O que pode fazer?","Quando acessou?"],r:1,e:"Valida a identidade."},
{q:"Autorização responde:",o:["Quem é você?","O que pode fazer?","Onde está?","Qual senha?"],r:1,e:"Define permissões."},
{q:"Auditoria responde:",o:["O que aconteceu?","Quem é você?","Qual IP?","Qual senha?"],r:0,e:"Registra e verifica ações."},
{q:"Bcrypt é utilizado para:",o:["Hash de senhas","VPN","Firewall","Proxy"],r:0,e:"Protege senhas armazenadas."},
{q:"Argon2 é:",o:["Algoritmo de hash","Antivírus","IDS","IPS"],r:0,e:"Hash moderno para senhas."},
{q:"Certificado digital funciona como:",o:["Identidade virtual","Firewall","VPN","Hash"],r:0,e:"Representa identidade digital."},
{q:"Qual chave deve permanecer secreta?",o:["Pública","Privada","SSL","TLS"],r:1,e:"A chave privada não deve ser compartilhada."},
{q:"RSA é um algoritmo de:",o:["Hash","Criptografia assimétrica","Compressão","Firewall"],r:1,e:"Usa par de chaves."},
{q:"ECC significa:",o:["Criptografia de curva elíptica","Controle de acesso","Hash","Proxy"],r:0,e:"Oferece segurança com chaves menores."},
{q:"PKI é:",o:["Infraestrutura de Chaves Públicas","Firewall","VPN","SIEM"],r:0,e:"Gerencia certificados e chaves."},
{q:"SSL/TLS protege:",o:["Comunicações","Mouse","CPU","RAM"],r:0,e:"Criptografa a comunicação."},
{q:"Assinatura digital garante:",o:["Autenticidade e integridade","Velocidade","Anonimato","Backup"],r:0,e:"Confirma autoria e integridade."},
{q:"IDS tem como função:",o:["Detectar ameaças","Bloquear automaticamente","Criptografar","Filtrar sites"],r:0,e:"IDS alerta sobre intrusões."},
{q:"IPS tem como função:",o:["Apenas registrar","Bloquear ameaças","Gerar certificados","Criar VPN"],r:1,e:"IPS atua em tempo real."},
{q:"NIDS monitora:",o:["Rede","Usuário","Banco de dados","Email"],r:0,e:"Monitora tráfego da rede."},
{q:"HIDS monitora:",o:["Host específico","Internet inteira","VPN","Proxy"],r:0,e:"Instalado na máquina."},
{q:"Firewall atua como:",o:["Barreira de proteção","Hash","Certificado","Malware"],r:0,e:"Filtra tráfego."},
{q:"Proxy é:",o:["Servidor intermediário","Antivírus","IDS","IPS"],r:0,e:"Intermedia conexões."},
{q:"LGPD é uma lei de:",o:["Proteção de dados","Criptografia","Firewall","Hardware"],r:0,e:"Regula tratamento de dados pessoais."},
{q:"GDPR é:",o:["Regulamento europeu de proteção de dados","Firewall","VPN","Hash"],r:0,e:"Lei europeia de privacidade."},
{q:"Controle preventivo busca:",o:["Evitar incidentes","Registrar incidentes","Corrigir falhas","Auditar"],r:0,e:"Age antes do problema."},
{q:"Controle detectivo busca:",o:["Detectar incidentes","Evitar","Corrigir","Excluir"],r:0,e:"Identifica ocorrências."},
{q:"Controle corretivo busca:",o:["Corrigir consequências","Evitar","Detectar","Monitorar"],r:0,e:"Reduz danos após incidente."},
{q:"ISO 27001 está relacionada a:",o:["Gestão de segurança da informação","Hardware","Redes sociais","Programação"],r:0,e:"Norma internacional de SGSI."},
{q:"NIST Cybersecurity Framework é:",o:["Framework de segurança","Malware","Banco","Firewall"],r:0,e:"Boas práticas de segurança."},
{q:"Smishing utiliza:",o:["SMS","USB","Bluetooth","Firewall"],r:0,e:"Phishing via SMS."},
{q:"Vishing utiliza:",o:["Chamadas de voz","VPN","Hash","Logs"],r:0,e:"Phishing por voz."},
{q:"Reconhecimento é fase de:",o:["Ciclo de ataque","Backup","Criptografia","Hash"],r:0,e:"Coleta de informações."},
{q:"DDoS tem como objetivo:",o:["Indisponibilizar serviços","Criptografar dados","Criar certificados","Gerar hash"],r:0,e:"Sobrecarrega recursos."},
{q:"Autenticidade garante:",o:["Origem confiável","Velocidade","Backup","Cache"],r:0,e:"Confirma autoria."},
{q:"Privacidade refere-se a:",o:["Controle sobre dados pessoais","Firewall","IDS","IPS"],r:0,e:"Uso adequado dos dados."},
{q:"Hash é usado para:",o:["Verificar integridade","Aumentar banda","Filtrar pacotes","Criar VPN"],r:0,e:"Mudanças alteram o hash."},
{q:"VPN serve para:",o:["Criar túnel seguro","Detectar malware","Emitir certificados","Fazer cache"],r:0,e:"Protege comunicações."},
{q:"EternalBlue foi explorada pelo:",o:["WannaCry","Nmap","Wireshark","OpenSSL"],r:0,e:"Falha SMB explorada pelo WannaCry."},
{q:"Qual malware exibe anúncios invasivos?",o:["Adware","Rootkit","Worm","Trojan"],r:0,e:"Adware mostra propagandas."},
{q:"Qual malware captura imagens da tela?",o:["Screenlogger","Firewall","IPS","VPN"],r:0,e:"Registra capturas da tela."}
];

let atual=0,pontos=0;
perguntas.sort(()=>Math.random()-0.5);

function carregar(){
document.getElementById("feedback").innerHTML="";
document.getElementById("nextBtn").style.display="none";
let p=perguntas[atual];
document.getElementById("question").textContent=p.q;
document.getElementById("status").textContent=`Questão ${atual+1} de ${perguntas.length}`;
document.getElementById("bar").style.width=((atual/perguntas.length)*100)+"%";
let html="";
p.o.forEach((op,i)=>{
html+=`<div class="option" onclick="responder(${i})">${String.fromCharCode(65+i)}) ${op}</div>`;
});
document.getElementById("options").innerHTML=html;
}

function responder(i){
let p=perguntas[atual];
let fb=document.getElementById("feedback");
if(i===p.r){
pontos++;
fb.innerHTML=`<p class='correct'>✔ Correto!</p><p>${p.e}</p>`;
}else{
fb.innerHTML=`<p class='wrong'>✖ Errado!</p><p>Resposta correta: <b>${p.o[p.r]}</b></p><p>${p.e}</p>`;
}
document.getElementById("options").innerHTML="";
document.getElementById("nextBtn").style.display="inline-block";
}

document.getElementById("nextBtn").onclick=()=>{
atual++;
if(atual<perguntas.length){carregar();}
else{
let perc=(pontos/perguntas.length*100).toFixed(1);
let nivel=perc>=90?"Excelente":perc>=70?"Bom":perc>=50?"Regular":"Precisa revisar";
document.querySelector(".container").innerHTML=`<h1>Resultado Final</h1><h2>${pontos}/${perguntas.length}</h2><h2>${perc}%</h2><h3>${nivel}</h3><button onclick="location.reload()">Refazer Quiz</button>`;
}
};
carregar();
</script>
</body>
</html>
